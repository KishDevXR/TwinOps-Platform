[project]
name = "twinops"
version = "0.1.0"
description = "TwinOps — Industrial Digital Twin & Asset Management Platform"
authors = [{ name = "TwinOps Engineering Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "paho-mqtt>=2.0.0",
    "asyncua>=1.1.0",
    "pymodbus>=3.6.0",
    "aiosqlite>=0.20.0",
    "numpy>=2.0.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008", "BLE001", "S110"]
